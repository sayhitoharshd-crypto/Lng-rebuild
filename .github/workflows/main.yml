
name: LineGuard Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LineGuard APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LineGuard source
        run: |
          unzip -o LineGuard-Firebase-Email-Phone-Auth-Corrected-Source.zip -d .
          test -f LineGuard-Recovered-Original/pnpm-lock.yaml
          test -f LineGuard-Recovered-Original/pnpm-workspace.yaml

      - name: Install dependencies
        working-directory: LineGuard-Recovered-Original
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: LineGuard-Recovered-Original/artifacts/lineguard
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: LineGuard-Recovered-Original/artifacts/lineguard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK="LineGuard-Recovered-Original/artifacts/lineguard/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.+bundle'
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Android-APK
          path: LineGuard-Recovered-Original/artifacts/lineguard/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
